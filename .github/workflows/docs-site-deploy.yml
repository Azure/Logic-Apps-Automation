# Docs Site — Build & Link Validation (GitHub Actions, credential-free)
#
# Runs fast, credential-free type-checking, Astro build, and docs link/fragment
# validation on pull requests and pushes to `main`.
#
# Canary and Production Azure Static Web Apps deployments run on Azure DevOps
# (1ES Official pipeline `Logic-Apps-Automation-Docs`, definition 490778) using
# isolated Workload Identity Federation (WIF) service connections defined in
# `.azure-pipelines/docs-site-deploy.yml`. No Azure credentials or deployment
# tokens are used in GitHub Actions.

name: 'Docs Site: Deploy'

on:
  push:
    branches: [main]
    paths:
      - 'docs-site/**'
      - '.github/workflows/docs-site-deploy.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'docs-site/**'
      - '.github/workflows/docs-site-deploy.yml'

# Read-only permissions; this workflow never authenticates to Azure.
permissions:
  contents: read

concurrency:
  group: docs-site-build-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  DOCS_APP_LOCATION: 'docs-site'
  DOCS_OUTPUT_LOCATION: 'dist'

jobs:
  # --------------------------------------------------------------------------
  # Credential-free build and validation. Preserves the `Build` job name for
  # branch protection checks.
  # --------------------------------------------------------------------------
  build:
    name: 'Build'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
          lfs: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ${{ env.DOCS_APP_LOCATION }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ env.DOCS_APP_LOCATION }}
        run: npm ci --no-audit --no-fund

      - name: Type-check and lint content
        working-directory: ${{ env.DOCS_APP_LOCATION }}
        run: npm run check

      - name: Build (Astro)
        working-directory: ${{ env.DOCS_APP_LOCATION }}
        env:
          DOCS_SITE_URL: ${{ vars.DOCS_SITE_URL || '' }}
        run: npm run build

      - name: Unit test docs link checker
        working-directory: ${{ env.DOCS_APP_LOCATION }}
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'

      - name: Validate built docs links and fragments
        working-directory: ${{ env.DOCS_APP_LOCATION }}
        run: python3 scripts/validate_docs_site.py

      - name: Upload built site
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs-dist
          path: ${{ env.DOCS_APP_LOCATION }}/${{ env.DOCS_OUTPUT_LOCATION }}
          retention-days: 7
          if-no-files-found: error
