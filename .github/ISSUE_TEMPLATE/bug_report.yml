name: Bug Report
description: Report a bug in the runtime, portal, or AI assistant.
labels: ["bug"]
body:
  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which part of the platform is affected?
      options:
        - Runtime
        - Portal
        - AI Assistant
        - Docs
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what went wrong.
      placeholder: "When I do X, Y happens instead of Z."
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Minimal steps to reproduce the issue.
      placeholder: |
        1. Go to '...'
        2. Select '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots / logs
      description: If applicable, add screenshots, error messages, or run history output.
    validations:
      required: false

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Browser, OS, region, or any relevant context.
      placeholder: |
        - Browser: Chrome 126
        - OS: Windows 11
        - Region: West US 2
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Workflow definition snippet, connection type, or anything else that helps.
    validations:
      required: false
